# Netlify 部署配置：站点已提升到仓库根目录，发布根 = "."
# 构建时由 build_data.py 生成 index.json 与 downloads/*.zip（含图片）。
# pypinyin / tokenizers / Pillow 与 tools/deepseek_v4_tokenizer.zip 是构建期依赖；
# 本地只预览站点（python -m http.server）不需要安装。
[build]
  command = "pip install -r requirements.txt && python3 build_data.py"
  publish = "."

# 显式覆盖各部署上下文，避免 Netlify UI / 旧站点设置仍指向 web/
[context.production]
  publish = "."

[context.deploy-preview]
  publish = "."

[context.branch-deploy]
  publish = "."
